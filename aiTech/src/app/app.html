<div class="main-dashboard-wrapper">
  
  <!-- LEFT SIDE: Full Height Branding Sidebar matching image -->
  <div class="dashboard-sidebar">
    <div class="brand-section">
      <img src="chat.png" alt="AI Troubleshooting Assistant Logo" class="brand-logo">
    </div>
  </div>

  <!-- RIGHT SIDE: Integrated Chatbot Panel -->
  <div class="dashboard-chat-panel">
    <div class="chat-header">
      <div class="title-flex">
        <span class="pulse-dot"></span>
        <h3>AI Troubleshooting Assistant</h3>
      </div>
      <span class="sub-text">Powered by Gemini</span>
    </div>

    <!-- Message Feed -->
    <div class="chat-messages-area" #scrollContainer>
      <div *ngFor="let msg of messages" class="message-row" [ngClass]="{'user-row': msg.sender === 'user', 'bot-row': msg.sender === 'bot'}">
        
        <!-- User Bubble with Hover Edit Button -->
        <div class="bubble-container user-container" *ngIf="msg.sender === 'user'">
          <button class="edit-btn" (click)="editMessage(msg.text)" title="Edit message">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          </button>
          <div class="bubble user-bubble">
            {{ msg.text }}
          </div>
        </div>

        <!-- Bot Bubble with conditional error styling -->
        <div class="bubble bot-bubble" [ngClass]="{'error-bubble': msg.status === 'error'}" *ngIf="msg.sender === 'bot'">
          <div class="header-flex" style="display: flex; align-items: center; gap: 8px;">
            <span class="error-icon" *ngIf="msg.status === 'error'">⚠️</span>
            <p class="summary-text">{{ msg.message }}</p>
          </div>
          
          <ul class="solution-steps" *ngIf="msg.solution && msg.solution.length">
            <li *ngFor="let step of msg.solution; let i = index" [ngClass]="{'error-step': msg.status === 'error'}">
              <span class="step-badge" *ngIf="i > 0 || !msg.message?.includes('Hello')">{{ i + 1 }}</span>
              <span class="step-content">{{ step }}</span>
            </li>
          </ul>
        </div>

      </div>

      <!-- Loading Animation -->
      <div class="loading-row" *ngIf="isLoading">
        <div class="typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- Input Footer -->
    <div class="chat-input-footer">
      <input 
        type="text" 
        [(ngModel)]="userPrompt" 
        (keyup.enter)="sendMessage()" 
        placeholder="Describe deployment error or bug..." 
      />
      <button class="send-btn" (click)="sendMessage()" [disabled]="isLoading">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>

  </div>

</div>
<router-outlet></router-outlet>
